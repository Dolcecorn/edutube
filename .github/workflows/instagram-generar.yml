# Genera la publicación del día (texto con OpenAI o Claude, gráficas con Pillow, reel con ffmpeg).
# Modo revisión (por defecto): abre un PR con la publicación; al aceptarlo (merge) entra a la cola.
# Modo automático: variable AUTO_PUBLICAR = true; la deja directo en la cola, sin intervención.
name: Generar publicación de Instagram

on:
  schedule:
    - cron: "0 12 * * *"   # todos los días ~09:00 de Chile (verano) / 08:00 (invierno)
  workflow_dispatch:
    inputs:
      tipo:
        description: "Forzar tipo (vacío = alternar)"
        type: choice
        options: ["", post, reel, carrusel]
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: instagram-generar
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r instagram/requirements.txt

      - name: Generar contenido
        id: gen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIPO: ${{ inputs.tipo }}
        run: python3 instagram/generar.py

      - name: Guardar (automático)
        if: vars.AUTO_PUBLICAR == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add instagram
          git commit -m "Instagram: ${{ steps.gen.outputs.tipo }} ${{ steps.gen.outputs.tema }}"
          git push

      - name: Abrir PR para revisar
        if: vars.AUTO_PUBLICAR != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CARPETA: ${{ steps.gen.outputs.carpeta }}
          TIPO: ${{ steps.gen.outputs.tipo }}
          TEMA: ${{ steps.gen.outputs.tema }}
        run: |
          rama="instagram/$(basename "$CARPETA")"
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$rama"
          git add instagram
          git commit -m "Instagram: $TIPO $TEMA"
          git push -u origin "$rama"
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)/${CARPETA}"
          {
            echo "**$TIPO:** $TEMA"
            echo
            for f in "$CARPETA"/*.jpg "$CARPETA"/vista-previa.png; do
              [ -e "$f" ] && echo "<img src=\"$base/$(basename "$f")\" width=\"270\">"
            done
            [ -e "$CARPETA/video.mp4" ] && echo && echo "[Ver el reel]($base/video.mp4)"
            echo
            echo "### Descripción"
            echo
            cat "$CARPETA/texto.txt"
            echo
            echo "---"
            echo "Para publicarla: **Merge**. Para descartarla: **Close**. Sale a las $(cat "$CARPETA/fecha.txt")."
          } > cuerpo.md
          gh pr create --base main --head "$rama" --title "Instagram: $TIPO · $TEMA" --body-file cuerpo.md
