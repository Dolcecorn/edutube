# Genera las publicaciones del día siguiente (09:00 y 18:30) (texto con OpenAI o Claude, gráficas con Pillow, reel con ffmpeg).
# Modo revisión (por defecto): abre un PR con la publicación; al aceptarlo (merge) entra a la cola.
# Modo automático: variable AUTO_PUBLICAR = true; la deja directo en la cola, sin intervención.
name: Generar publicación de Instagram

on:
  schedule:
    - cron: "0 13 * * *"   # todos los días ~10:00 de Chile (verano) / 09:00 (invierno); prepara las publicaciones del día siguiente
  workflow_dispatch:
    inputs:
      tipo:
        description: "Forzar tipo (vacío = alternar)"
        type: choice
        options: ["", post, reel, carrusel]
        default: ""
      tema:
        description: "Tema (vacío = lo elige la IA)"
        type: string
        default: ""
      fecha:
        description: "Día de publicación AAAA-MM-DD (vacío = mañana)"
        type: string
        default: ""
      horarios:
        description: "Horas, separadas por coma (vacío = las de marca.json: 09:00,18:30)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: instagram-generar
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r instagram/requirements.txt

      - name: Generar contenido
        id: gen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIPO: ${{ inputs.tipo }}
          TEMA: ${{ inputs.tema }}
          FECHA: ${{ inputs.fecha }}
          HORARIOS: ${{ inputs.horarios }}
        run: python3 instagram/generar.py ${FECHA:+--fecha "$FECHA"} ${HORARIOS:+--horarios "$HORARIOS"}

      - name: Guardar (automático)
        if: vars.AUTO_PUBLICAR == 'true'
        env:
          RESUMEN: ${{ steps.gen.outputs.resumen }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add instagram
          git commit -m "Instagram: $RESUMEN"
          git push

      - name: Abrir PR para revisar
        if: vars.AUTO_PUBLICAR != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CARPETAS: ${{ steps.gen.outputs.carpetas }}
          DIA: ${{ steps.gen.outputs.dia }}
          RESUMEN: ${{ steps.gen.outputs.resumen }}
        run: |
          rama="instagram/$DIA-$(date +%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$rama"
          git add instagram
          git commit -m "Instagram: $RESUMEN"
          git push -u origin "$rama"
          sha=$(git rev-parse HEAD)
          {
            for CARPETA in $CARPETAS; do
              base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$sha/${CARPETA}"
              echo "## $(cat "$CARPETA/fecha.txt") · $(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['tema'])" "$CARPETA/contenido.json")"
              echo
              for f in "$CARPETA"/*.jpg "$CARPETA"/vista-previa.png; do
                [ -e "$f" ] && echo "<img src=\"$base/$(basename "$f")\" width=\"230\">"
              done
              [ -e "$CARPETA/video.mp4" ] && echo && echo "[Ver el reel]($base/video.mp4)"
              echo
              echo "<details><summary>Descripción</summary>"
              echo
              cat "$CARPETA/texto.txt"
              echo
              echo "</details>"
              echo
            done
            echo "---"
            echo "Para publicarlas: **Merge**. Para descartarlas: **Close** (o pídele a Claude que cambie una)."
          } > cuerpo.md
          # GitHub a veces falla al crear el PR justo después del push: reintentar
          for i in 1 2 3 4 5; do
            gh pr create --base main --head "$rama" --title "Instagram $DIA: $RESUMEN" --body-file cuerpo.md && exit 0
            sleep $((i * 10))
          done
          exit 1
