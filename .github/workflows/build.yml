# Compila edutube.ipa (sin firmar) en un Mac de GitHub. La firma la pone Impactor/Sideloadly con tu Apple ID.
name: Compilar edutube.ipa

on:
  push:
    branches: [main]
  # También se puede compilar a mano desde otra rama: queda como versión de prueba, sin tocar la última.
    paths-ignore: ['instagram/**', '.github/workflows/instagram*.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar proyecto de Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar
        run: |
          xcodebuild -project TVWeb.xcodeproj -scheme TVWeb -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TVWeb.app Payload/
          zip -qr edutube.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: edutube-ipa
          path: edutube.ipa

      - name: Publicar en "Releases" (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'ultima' || 'prueba' }}
          name: ${{ github.ref_name == 'main' && 'edutube para iPhone (última versión)' || 'edutube para iPhone (versión de prueba)' }}
          files: edutube.ipa
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
