# Publica en Instagram lo que esté en instagram/cola/ cuando llega su hora.
name: Publicar en Instagram

on:
  schedule:
    - cron: "2,32 * * * *"   # cada media hora: la de 9:00 sale ~9:02 y la de 18:30 ~18:32 (GitHub puede atrasarse)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo probar, sin publicar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # lo último de main al empezar (no el commit del disparo), para no publicar dos veces

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 instagram/publicar.py

      - name: Mover lo publicado y guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A instagram
          git diff --cached --quiet || {
            git commit -m "Instagram: publicado $(date -u +%F)"
            for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 5; done
          }
