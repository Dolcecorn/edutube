# Publica en Instagram lo que esté en la cola de cada perfil cuando llega su hora
# (AHP: instagram/cola/; otros perfiles: instagram/perfiles/<perfil>/cola/).
name: Publicar en Instagram

on:
  schedule:
    - cron: "3,33 * * * *"   # cada media hora: la de 9:00 sale ~9:03 y la de 18:30 ~18:33 (GitHub puede atrasarse)
  workflow_dispatch:
    inputs:
      perfil:
        description: "Perfil (vacío = todos: ahp y los de instagram/perfiles/)"
        type: string
        default: ""
      dry_run:
        description: "Solo probar, sin publicar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # lo último de main al empezar (no el commit del disparo), para no publicar dos veces

      - name: Publicar
        env:
          # cada perfil usa sus secrets: IG_USER_ID / IG_ACCESS_TOKEN (AHP) o IG_USER_ID_<PERFIL> / IG_ACCESS_TOKEN_<PERFIL>.
          # Se nombran uno por uno (pasar todos los secrets con toJSON deja el workflow esperando aprobación).
          # Al agregar un perfil nuevo, sumar aquí sus dos líneas.
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_LEGALMAIN: ${{ secrets.IG_USER_ID_LEGALMAIN }}
          IG_ACCESS_TOKEN_LEGALMAIN: ${{ secrets.IG_ACCESS_TOKEN_LEGALMAIN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SOLO: ${{ inputs.perfil }}
        run: |
          perfiles="${SOLO:-ahp $(ls instagram/perfiles 2>/dev/null | grep -v '\.' | tr '\n' ' ')}"
          fallo=0
          for p in $perfiles; do
            echo "== $p"
            PERFIL=$p python3 instagram/publicar.py || fallo=1
          done
          exit $fallo

      - name: Mover lo publicado y guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A instagram
          git diff --cached --quiet || {
            git commit -m "Instagram: publicado $(date -u +%F)"
            for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 5; done
          }
