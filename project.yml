name: TVWeb
options:
  bundleIdPrefix: cl.eleva
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.9"
    CURRENT_PROJECT_VERSION: "10"
targets:
  TVWeb:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - Sources
      - Resources
    dependencies:
      - target: Mirror
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.eleva.tvweb
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: edutube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: false
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: edutube busca tu Chromecast en la red Wi-Fi para enviarle videos.
        NSBonjourServices: [_googlecast._tcp]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: cl.eleva.tvweb.tvgratis
            UIApplicationShortcutItemTitle: TV gratis
            UIApplicationShortcutItemSubtitle: Canales, deportes y películas
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypePlay
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
  Mirror:
    type: app-extension
    platform: iOS
    sources:
      - MirrorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.eleva.tvweb.Mirror
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MirrorExtension/Info.plist
    info:
      path: MirrorExtension/Info.plist
      properties:
        CFBundleDisplayName: edutube Espejo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: edutube envía la pantalla a tu Chromecast por la red Wi-Fi.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
